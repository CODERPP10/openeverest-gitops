annotations:
  artifacthub.io/links: |
    - name: Documentation
      url: https://openeverest.io/documentation/current/
  helm.sh/release-max-history: "5"
apiVersion: v2
appVersion: 1.15.2
dependencies:
- name: common
  repository: file://charts/common
  version: 0.0.*
- alias: dbNamespace
  condition: dbNamespace.enabled
  name: everest-db-namespace
  repository: file://charts/everest-db-namespace
  version: 1.15.2
- condition: kube-state-metrics.enabled
  name: kube-state-metrics
  repository: https://prometheus-community.github.io/helm-charts
  version: 5.27.0
- alias: monitoring
  condition: monitoring.enabled
  name: victoria-metrics-operator
  repository: https://victoriametrics.github.io/helm-charts
  version: 0.43.0
- condition: pmm.enabled
  name: pmm
  repository: https://percona.github.io/percona-helm-charts
  version: 1.3.*
- condition: pmm3.enabled
  name: pmm3
  repository: file://charts/pmm3
  version: 0.0.*
- condition: everest-crds.enabled
  name: everest-crds
  repository: file://charts/everest-crds
  version: 1.15.2
- alias: olm
  condition: olm.install
  name: operator-lifecycle-manager
  repository: https://percona.github.io/operator-lifecycle-manager
  version: 0.1.*
description: A cloud-native database platform
home: https://openeverest.io
icon: https://github.com/openeverest/.github/raw/main/logo/logo-horizontal-full-color-white-min.png
keywords:
- kubernetes
- database
- db
- postgres
- postgresql
- mysql
- mongodb
- operator
- percona
- cloud-native
- dbaas
- database-as-a-service
- backup
- restore
- monitoring
- everest
kubeVersion: '>= 1.27.0-0'
maintainers:
- email: mayank.shah@percona.com
  name: mayankshah1607
- email: oksana.grishchenko@percona.com
  name: oksana-grishchenko
- email: diogo.recharte@percona.com
  name: recharte
- email: sp@solanica.io
  name: spron-in
name: openeverest
type: application
version: 1.15.2
